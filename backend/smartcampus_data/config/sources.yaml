# Official sources for SA-18.
# Only public pages/brochures owned by the four establishments are configured.
# Patterns are intentionally narrow: no whole-site crawl, no authentication, no anti-bot bypass.

defaults:
  request_timeout: 20
  max_retries: 2
  delay_seconds: 1.2
  max_depth: 2
  max_pages: 30
  max_pdfs: 10
  url_include_patterns:
    - "/formation"
    - "/formations"
    - "/licence"
    - "/licences"
    - "/master"
    - "/mast"
    - "/program"
    - "/architecture"
    - "/admission"
    - "/prepa"
    - "/contact"
    - "/iit/"
    - "/isb/"
    - "/pcf"
  url_exclude_patterns:
    - "/wp-content/uploads/"
    - "/wp-json/"
    - "/feed"
    - "/login"
    - "/intranet"
    - "/espace-etudiant"
    - "/vie-estudiantine"
    - "/actualite"
    - "/post/"
    - "/alumni"
    - "/recherche/"
    - "/bourse"
    - "/pre-inscription"
    - "/preinscription"
    - "/guide-etudiants"
    - "#"

establishments:
  IIT:
    id: IIT
    name: Institut International de Technologie
    short_name: IIT
    base_url: https://iit.tn
    country: Tunisie
    city: Sfax
    sitemaps:
      - https://iit.tn/sitemap_index.xml
      - https://iit.tn/page-sitemap.xml
    catalog_urls:
      - https://iit.tn/formation/
      - https://iit.tn/licences/
      - https://iit.tn/mastere/
      - https://iit.tn/filieres-ingenieur/
      - https://iit.tn/prepa/
      - https://iit.tn/architecture-2/
    extra_urls:
      - https://iit.tn/
      - https://iit.tn/test/procedure-et-frais-dinscription/
      - https://iit.tn/contact-3/
    formation_url_patterns:
      - "/licence-en-systemes-electriques"
      - "/licence-en-mecatronique"
      - "/reseaux-et-cybersecurite"
      - "/systemes-embarques"
      - "/big-data-et-analyse-de-donnees"
      - "/genie-logiciel-systemes-intelligents"
      - "/filieres-ingenieur/genie-"
      - "/genie-des-procedes"
      - "/prepa/"
      - "/architecture-2/"
      - "/mastere/"
    formation_title_patterns:
      - "big data"
      - "génie logiciel"
      - "réseaux et cybersécurité"
      - "systèmes embarqués"
      - "mécatronique"
      - "systèmes électriques"
      - "génie civil"
      - "génie informatique"
      - "génie mécanique"
      - "génie industriel"
      - "génie des procédés"
      - "cycle préparatoire"
      - "architecture"
      - "mastère"
    max_pages: 30
    max_pdfs: 8

  ISB:
    id: ISB
    name: International School of Business
    short_name: ISB
    base_url: https://isb.tn
    country: Tunisie
    city: Sfax
